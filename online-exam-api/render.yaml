services:
  - type: web
    name: online-exam-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_DRIVER
        value: mongodb
      - key: MONGODB_URI
        sync: false # Requires manual entry in the dashboard
      - key: JWT_SECRET
        sync: false # Requires manual entry in the dashboard
      - key: FRONTEND_URL
        sync: false # Set to your Vercel URL
